app-id: net.karahan.PDFAnnotationExtractor
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk

command: pdf-annotation-extractor

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home
  - --device=dri
  - --env=QT_QPA_PLATFORM=wayland

build-options:
  append-path: /usr/lib/sdk/python3.11/bin:/usr/lib/sdk/python3/bin
  env:
    PYTHONPATH: /app/lib/python3.11/site-packages

modules:
  - name: pdf-annotation-extractor
    buildsystem: simple
    build-commands:
      - pip3 install PyMuPDF PyQt6 PyQt6-WebEngine
      - pip3 install --no-build-isolation -e .
      - install -Dm644 net.karahan.PDFAnnotationExtractor.desktop /app/share/applications/net.karahan.PDFAnnotationExtractor.desktop
      - install -Dm644 net.karahan.PDFAnnotationExtractor.metainfo.xml /app/share/metainfo/net.karahan.PDFAnnotationExtractor.metainfo.xml
      - install -Dm644 assets/net.karahan.PDFAnnotationExtractor.png /app/share/icons/hicolor/128x128/apps/net.karahan.PDFAnnotationExtractor.png
    sources:
      - type: dir
        path: .
